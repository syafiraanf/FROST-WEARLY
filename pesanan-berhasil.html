<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesanan Berhasil &amp; Cek Pesanan - FROST WEARLY</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #F8FAFC;
      color: #0F2537;
    }

    /* NAVBAR */
    .navbar {
      background-color: #FFFFFF;
      height: 60px;
      padding: 0 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #E2E8F0;
    }

    .logo-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #0F2537;
      font-weight: bold;
      font-size: 14px;
    }

    .fw-badge {
      background-color: #16232E;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: bold;
      padding: 5px 7px;
      border-radius: 5px;
    }

    .menu-nav {
      display: flex;
      gap: 16px;
      list-style: none;
    }

    .menu-nav a {
      text-decoration: none;
      color: #334155;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
    }

    .menu-nav a.aktif {
      background-color: #EBF3FA;
      color: #0F2537;
      font-weight: bold;
    }

    .kanan-nav {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
    }

    .grup-profil {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .profil-bulat {
      background: #0F2537;
      color: #FFFFFF;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
    }

    /* WADAH UTAMA */
    .wadah {
      max-width: 860px;
      margin: 32px auto 60px;
      padding: 0 20px;
    }

    .kartu-sukses {
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 20px;
    }

    .header-sukses {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid #E2E8F0;
      margin-bottom: 20px;
    }

    .ikon-centang {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #DCFCE7;
      color: #15803D;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .badge-status {
      display: inline-block;
      background-color: #EBF3FA;
      color: #0F2537;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .judul-sukses {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .sub-sukses {
      font-size: 13px;
      color: #64748B;
    }

    .grid-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 22px;
    }

    .kotak-info {
      background-color: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.6;
    }

    .kotak-info h3 {
      font-size: 12px;
      text-transform: uppercase;
      color: #64748B;
      margin-bottom: 6px;
      letter-spacing: 0.4px;
    }

    .daftar-item {
      border-top: 1px solid #E2E8F0;
      padding-top: 16px;
      margin-bottom: 18px;
    }

    .daftar-item h3 {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .baris-produk {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #F1F5F9;
      font-size: 13px;
    }

    .baris-produk:last-child {
      border-bottom: none;
    }

    .ringkasan-biaya {
      background-color: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 22px;
    }

    .baris-biaya {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #475569;
      margin-bottom: 8px;
    }

    .baris-total {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
      color: #0F2537;
      padding-top: 10px;
      border-top: 1px solid #E2E8F0;
      margin-top: 8px;
    }

    .aksi-akhir {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-utama {
      background-color: #16232E;
      color: #FFFFFF;
      text-decoration: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 13px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-utama:hover {
      background-color: #0F2537;
    }

    .btn-sekunder {
      background-color: #FFFFFF;
      color: #0F2537;
      text-decoration: none;
      border: 1.5px solid #CBD5E1;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 13px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-sekunder:hover {
      background-color: #F8FAFC;
      border-color: #0F2537;
    }

    .grid-alur {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .kotak-tahap {
      border: 1.5px solid #E2E8F0;
      background-color: #F8FAFC;
      border-radius: 10px;
      padding: 12px;
    }

    .kotak-tahap.aktif {
      border-color: #0F2537;
      background-color: #EBF3FA;
    }

    .btn-simulasi {
      background-color: #EBF3FA;
      color: #0F2537;
      border: 1px solid #CBD5E1;
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-simulasi:hover {
      background-color: #DCEAF6;
    }

    .item-riwayat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      background-color: #FFFFFF;
    }

    .item-riwayat.terpilih {
      background-color: #F8FAFC;
      border-color: #0F2537;
    }

    @media (max-width: 700px) {
      .grid-info,
      .grid-alur {
        grid-template-columns: 1fr 1fr;
      }
      .menu-nav {
        display: none;
      }
      .aksi-akhir {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="beranda.html" class="logo-brand">
      <span class="fw-badge">FW</span>
      <span>FROST WEARLY</span>
    </a>

    <ul class="menu-nav">
      <li><a href="beranda.html">Beranda</a></li>
      <li><a href="katalog.html">Katalog</a></li>
      <li><a href="pesanan-berhasil.html" class="aktif">Cek Pesanan</a></li>
      <li><a href="tentang-kami.html">Tentang Kami</a></li>
    </ul>

    <div class="kanan-nav">
      <div class="grup-profil">
        <div class="profil-bulat">SF</div>
        <span>syafiraa</span>
      </div>
    </div>
  </header>

  <main class="wadah">
    <section class="kartu-sukses" id="konten-pesanan"></section>

    <section class="kartu-sukses" id="panel-alur-pengiriman">
      <h2 style="font-size:16px; font-weight:bold; margin-bottom:6px;">Alur Pengiriman Pesanan</h2>
      <p id="info-estimasi-kurir" style="font-size:12px; color:#64748B; margin-bottom:18px;"></p>

      <div id="timeline-pengiriman" class="grid-alur"></div>

      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding-top:14px; border-top:1px solid #E2E8F0; font-size:12px;">
        <span id="status-tahap-teks" style="color:#475569;"></span>
        <button type="button" class="btn-simulasi" onclick="simulasikanUpdateStatus()">
          Simulasi Update Status Pengiriman
        </button>
      </div>
    </section>

    <section class="kartu-sukses" id="panel-riwayat-pesanan">
      <h2 style="font-size:16px; font-weight:bold; margin-bottom:12px;">Cek Riwayat Pesanan Saya</h2>
      <div id="daftar-riwayat-pesanan"></div>
    </section>
  </main>

  <script>
    const daftarTahap = [
      { judul: "Pesanan Dibuat", ket: "Transaksi tercatat" },
      { judul: "Dikemas", ket: "Penyiapan & QC barang" },
      { judul: "Dalam Pengiriman", ket: "Diantar oleh kurir" },
      { judul: "Selesai", ket: "Paket diterima" }
    ];

    function formatRp(angka) {
      return "Rp " + Number(angka || 0).toLocaleString("id-ID");
    }

    function getRiwayat() {
      const utama = JSON.parse(localStorage.getItem("pesananTerakhirFrostWearly"));
      let list = JSON.parse(localStorage.getItem("riwayatPesananFrostWearly"));
      if (!Array.isArray(list)) list = [];

      if (utama && utama.kodePesanan) {
        const idxAda = list.findIndex(item => item.kodePesanan === utama.kodePesanan);
        if (idxAda === -1) {
          list.unshift({ ...utama, tahapAktif: Number(utama.tahapAktif || 1) });
        } else {
          list[idxAda] = {
            ...list[idxAda],
            ...utama,
            tahapAktif: Number(utama.tahapAktif || list[idxAda].tahapAktif || 1)
          };
          const dipindah = list.splice(idxAda, 1)[0];
          list.unshift(dipindah);
        }
        localStorage.setItem("riwayatPesananFrostWearly", JSON.stringify(list));
      }

      return list;
    }

    function renderPesananBerhasil() {
      const data = JSON.parse(localStorage.getItem("pesananTerakhirFrostWearly"));
      const wadah = document.getElementById("konten-pesanan");

      if (!data || !Array.isArray(data.items) || data.items.length === 0) {
        wadah.innerHTML = `
          <div class="header-sukses">
            <div class="ikon-centang">&#10003;</div>
            <div>
              <span class="badge-status">FROST WEARLY</span>
              <h1 class="judul-sukses">Belum Ada Pesanan Terbaru</h1>
              <p class="sub-sukses">Silakan pilih produk favoritmu di katalog terlebih dahulu.</p>
            </div>
          </div>
          <div class="aksi-akhir">
            <a href="katalog.html" class="btn-utama">Kembali ke Katalog</a>
          </div>
        `;
        renderAlurDanRiwayat();
        return;
      }

      const subtotal = data.items.reduce((sum, item) => sum + (Number(item.hargaAngka || 0) * Number(item.qty || 1)), 0);
      const ongkir = Number(data.ongkir || 15000);
      const diskon = Number(data.diskon || 10000);
      const totalBayar = Math.max(0, subtotal + ongkir - diskon);

      const daftarHtml = data.items.map(item => {
        const qty = Number(item.qty || 1);
        const harga = Number(item.hargaAngka || 0);
        const varian = item.warna ? `${item.warna}, Ukuran ${item.ukuran || "M"}` : `Ukuran ${item.ukuran || "M"}`;
        return `
          <div class="baris-produk">
            <div>
              <strong>${item.nama}</strong>
              <div style="font-size:12px; color:#64748B;">${qty}x &bull; ${formatRp(harga)} (${varian})</div>
            </div>
            <strong>${formatRp(qty * harga)}</strong>
          </div>
        `;
      }).join("");

      wadah.innerHTML = `
        <div class="header-sukses">
          <div class="ikon-centang">&#10003;</div>
          <div>
            <span class="badge-status">PESANAN DIBUAT &bull; ${data.kodePesanan || "FW-2026"}</span>
            <h1 class="judul-sukses">Terima Kasih, Pesananmu Sedang Diproses!</h1>
            <p class="sub-sukses">Detail konfirmasi pesanan dan instruksi pembayaran telah dicatat untuk akun <strong>syafiraa</strong>.</p>
          </div>
        </div>

        <div class="grid-info">
          <div class="kotak-info">
            <h3>Alamat Pengiriman</h3>
            <div><strong>${data.penerima || "Syafira Nur (Rumah Utama)"}</strong></div>
            <div>${data.telepon || "+62 812-3456-7890"}</div>
            <div style="color:#475569;">${data.alamat || "Jl. Bromo No. 67, Kec. Klojen, Kota Malang, Jawa Timur, 65111"}</div>
          </div>

          <div class="kotak-info">
            <h3>Pengiriman &amp; Pembayaran</h3>
            <div>Kurir: <strong>${data.kurir || "JNE Reguler"}</strong></div>
            <div>Metode: <strong>${data.metodeBayar || "Transfer Bank Manual (BCA)"}</strong></div>
            <div style="color:#475569;">Status: Menunggu Konfirmasi / Proses Kemas</div>
          </div>
        </div>

        <div class="daftar-item">
          <h3>Detail Produk Dipesan</h3>
          ${daftarHtml}
        </div>

        <div class="ringkasan-biaya">
          <div class="baris-biaya">
            <span>Subtotal Produk</span>
            <strong>${formatRp(subtotal)}</strong>
          </div>
          <div class="baris-biaya">
            <span>Biaya Pengiriman</span>
            <strong>${formatRp(ongkir)}</strong>
          </div>
          <div class="baris-biaya">
            <span>Diskon Kupon</span>
            <strong style="color:#15803D;">- ${formatRp(diskon)}</strong>
          </div>
          <div class="baris-total">
            <span>Total Pembayaran</span>
            <span>${formatRp(totalBayar)}</span>
          </div>
        </div>

        <div class="aksi-akhir">
          <a href="katalog.html" class="btn-utama">Lanjut Belanja di Katalog</a>
          <a href="#panel-alur-pengiriman" class="btn-sekunder">Cek Alur Pengiriman</a>
        </div>
      `;

      renderAlurDanRiwayat();
    }

    function renderAlurDanRiwayat() {
      const list = getRiwayat();
      const panelAlur = document.getElementById("panel-alur-pengiriman");
      const panelRiwayat = document.getElementById("panel-riwayat-pesanan");

      if (!list.length) {
        document.getElementById("info-estimasi-kurir").textContent =
          "Belum ada pesanan tercatat • Contoh tahapan pengiriman:";
        document.getElementById("timeline-pengiriman").innerHTML = daftarTahap.map((t, i) => `
          <div class="kotak-tahap ${i === 0 ? "aktif" : ""}">
            <div style="font-size:11px; font-weight:bold; color:${i === 0 ? "#0F2537" : "#94A3B8"}; margin-bottom:4px;">Langkah ${i + 1}</div>
            <div style="font-size:13px; font-weight:bold; color:#0F2537; margin-bottom:2px;">${t.judul}</div>
            <div style="font-size:11px; color:#64748B;">${t.ket}</div>
          </div>
        `).join("");
        document.getElementById("status-tahap-teks").innerHTML =
          "Tahap saat ini: <strong>Menunggu Pesanan Dibuat</strong>";
        document.getElementById("daftar-riwayat-pesanan").innerHTML =
          `<p style="font-size:12px; color:#64748B;">Belum ada riwayat pesanan. Buat pesanan dari katalog lalu selesaikan pembayaran.</p>`;
        panelAlur.style.display = "block";
        panelRiwayat.style.display = "block";
        return;
      }

      const aktif = list[0];
      const tahap = Math.min(Math.max(Number(aktif.tahapAktif || 1), 1), 4);
      panelAlur.style.display = "block";
      panelRiwayat.style.display = "block";

      const estTeks = (aktif.kurir || "").toLowerCase().includes("sicepat")
        ? "Estimasi tiba: Esok hari (1 hari kerja)"
        : "Estimasi tiba: 2 - 3 hari kerja";

      document.getElementById("info-estimasi-kurir").textContent =
        `Kode ${aktif.kodePesanan} • Kurir ${aktif.kurir || "JNE Reguler"} • ${estTeks}`;

      document.getElementById("timeline-pengiriman").innerHTML = daftarTahap.map((t, i) => {
        const idx = i + 1;
        const selesai = idx <= tahap;
        return `
          <div class="kotak-tahap ${selesai ? "aktif" : ""}">
            <div style="font-size:11px; font-weight:bold; color:${selesai ? "#0F2537" : "#94A3B8"}; margin-bottom:4px;">Langkah ${idx}</div>
            <div style="font-size:13px; font-weight:bold; color:#0F2537; margin-bottom:2px;">${t.judul}</div>
            <div style="font-size:11px; color:#64748B;">${t.ket}</div>
          </div>
        `;
      }).join("");

      document.getElementById("status-tahap-teks").innerHTML =
        `Tahap saat ini: <strong>${daftarTahap[tahap - 1].judul}</strong>`;

      document.getElementById("daftar-riwayat-pesanan").innerHTML = list.map((pesanan, i) => {
        const namaItem = (pesanan.items || []).map(it => `${it.nama} (${it.qty}x)`).join(", ");
        const tahapIdx = Math.min(Math.max(Number(pesanan.tahapAktif || 1), 1), 4) - 1;
        const tahapPesanan = daftarTahap[tahapIdx].judul;
        return `
          <div onclick="pilihPesananAktif(${i})" class="item-riwayat ${i === 0 ? "terpilih" : ""}">
            <div>
              <strong>${pesanan.kodePesanan}</strong> • <span style="font-size:12px; color:#0F2537;">${tahapPesanan}</span>
              <div style="font-size:12px; color:#64748B; margin-top:2px;">${namaItem || "Produk Frost Wearly"}</div>
            </div>
            <div style="text-align:right; font-size:13px;">
              <strong>${formatRp(pesanan.totalBayar)}</strong>
              <div style="font-size:11px; color:#64748B;">Klik untuk cek</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function simulasikanUpdateStatus() {
      const list = getRiwayat();
      if (!list.length) return;
      const saatIni = Number(list[0].tahapAktif || 1);
      list[0].tahapAktif = saatIni < 4 ? saatIni + 1 : 1;
      localStorage.setItem("riwayatPesananFrostWearly", JSON.stringify(list));
      localStorage.setItem("pesananTerakhirFrostWearly", JSON.stringify(list[0]));
      renderAlurDanRiwayat();
    }

    function pilihPesananAktif(index) {
      const list = getRiwayat();
      if (!list[index]) return;
      const dipilih = list[index];
      list.splice(index, 1);
      list.unshift(dipilih);
      localStorage.setItem("riwayatPesananFrostWearly", JSON.stringify(list));
      localStorage.setItem("pesananTerakhirFrostWearly", JSON.stringify(dipilih));
      renderPesananBerhasil();
    }

    renderPesananBerhasil();
  </script>
</body>
</html>
