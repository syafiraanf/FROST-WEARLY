<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang Belanja - FROST WEARLY</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #F8FAFC;
      color: #0F2537;
    }

    /* NAVBAR */
    .navbar {
      background-color: #FFFFFF;
      height: 64px;
      padding: 0 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #E2E8F0;
      gap: 16px;
    }

    .kiri-nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .logo-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #0F2537;
      font-weight: bold;
      font-size: 14px;
    }

    .fw-badge {
      background-color: #1E293B;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: bold;
      padding: 5px 7px;
      border-radius: 5px;
    }

    .menu-nav {
      display: flex;
      gap: 18px;
      list-style: none;
    }

    .menu-nav a {
      text-decoration: none;
      color: #334155;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .menu-nav a.aktif {
      background-color: #EBF3FA;
      color: #0F2537;
      font-weight: bold;
    }

    .kanan-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
    }

    .btn-keranjang-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #CBD5E1;
      background-color: #EBF3FA;
      color: #0F2537;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
    }

    .btn-keranjang-nav span {
      background-color: #0F2537;
      color: #FFFFFF;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
    }

    .profil-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .profil-bulat {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #1E293B;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* KONTEN */
    .wadah {
      max-width: 1120px;
      margin: 24px auto 60px;
      padding: 0 20px;
    }

    .breadcrumb {
      font-size: 12px;
      color: #64748B;
      margin-bottom: 8px;
    }

    .breadcrumb a {
      color: #64748B;
      text-decoration: none;
    }

    .judul-halaman {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .grid-keranjang {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .kartu-daftar {
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 20px;
    }

    .baris-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid #E2E8F0;
    }

    .baris-item:last-child {
      border-bottom: none;
    }

    .thumb-item {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      background-color: #EBF3FA;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .kontrol-qty {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      padding: 3px 8px;
      background-color: #F8FAFC;
    }

    .btn-qty {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 4px;
      background-color: #FFFFFF;
      color: #0F2537;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-hapus {
      background-color: #FEE2E2;
      color: #B91C1C;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .kartu-ringkasan {
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 20px;
    }

    .kartu-ringkasan h2 {
      font-size: 16px;
      margin-bottom: 14px;
    }

    .baris-total {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
      padding-top: 12px;
      border-top: 1px solid #E2E8F0;
      margin: 14px 0 18px;
    }

    .btn-checkout {
      width: 100%;
      background-color: #16232E;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-checkout:hover {
      background-color: #0F2537;
    }

    .link-lanjut {
      display: inline-block;
      margin-top: 14px;
      font-size: 12px;
      color: #0284C7;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 850px) {
      .grid-keranjang {
        grid-template-columns: 1fr;
      }
      .menu-nav {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="kiri-nav">
      <a href="beranda.html" class="logo-brand">
        <span class="fw-badge">FW</span>
        <span>FROST WEARLY</span>
      </a>
      <ul class="menu-nav">
        <li><a href="beranda.html">Beranda</a></li>
        <li><a href="katalog.html">Katalog</a></li>
        <li><a href="tentang-kami.html">Tentang Kami</a></li>
      </ul>
    </div>

    <div class="kanan-nav">
      <a href="keranjang.html" class="btn-keranjang-nav">
        &#128722; Keranjang <span id="jumlah-keranjang">0</span>
      </a>
      <div class="profil-wrap">
        <div class="profil-bulat">SF</div>
        <span>syafiraa</span>
      </div>
    </div>
  </header>

  <main class="wadah">
    <div class="breadcrumb">
      <a href="beranda.html">Beranda</a> &rsaquo;
      <a href="katalog.html">Katalog</a> &rsaquo;
      <span>Keranjang Belanja</span>
    </div>
    <h1 class="judul-halaman">Keranjang Belanja</h1>

    <div class="grid-keranjang">
      <section class="kartu-daftar" id="daftar-keranjang"></section>

      <aside class="kartu-ringkasan">
        <h2>Ringkasan Belanja</h2>
        <div style="display:flex; justify-content:space-between; font-size:13px; color:#475569; margin-bottom:8px;">
          <span>Total Item</span>
          <strong id="total-qty">0 pcs</strong>
        </div>
        <div class="baris-total">
          <span>Subtotal</span>
          <span id="subtotal-keranjang">Rp 0</span>
        </div>
        <button type="button" class="btn-checkout" onclick="lanjutPembayaran()">Lanjut ke Pengiriman &amp; Pembayaran</button>
        <a href="katalog.html" class="link-lanjut">&larr; Lanjut Belanja di Katalog</a>
      </aside>
    </div>
  </main>

  <script>
    let keranjang = JSON.parse(localStorage.getItem("keranjangFrostWearly")) || [];

    function formatRp(angka) {
      return "Rp " + angka.toLocaleString("id-ID");
    }

    function simpanDanRender() {
      localStorage.setItem("keranjangFrostWearly", JSON.stringify(keranjang));
      renderKeranjang();
    }

    function ubahQty(idx, selisih) {
      if (!keranjang[idx]) return;
      keranjang[idx].qty += selisih;
      if (keranjang[idx].qty <= 0) {
        keranjang.splice(idx, 1);
      }
      simpanDanRender();
    }

    function hapusItem(idx) {
      keranjang.splice(idx, 1);
      simpanDanRender();
    }

    function lanjutPembayaran() {
      if (keranjang.length === 0) {
        alert("Keranjang masih kosong, pilih produk dulu ya!");
        return;
      }
      localStorage.setItem("pesananCheckoutFrostWearly", JSON.stringify(keranjang));
      window.location.href = "pembayaran.html";
    }

    function renderKeranjang() {
      const totalQty = keranjang.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById("jumlah-keranjang").textContent = totalQty;
      document.getElementById("total-qty").textContent = `${totalQty} pcs`;

      const wadah = document.getElementById("daftar-keranjang");
      if (keranjang.length === 0) {
        wadah.innerHTML = `
          <p style="font-size:14px; color:#64748B; padding:24px 0;">
            Keranjang belanjamu masih kosong. Yuk pilih produk dulu di <a href="katalog.html" style="color:#0F2537; font-weight:bold;">Katalog</a>!
          </p>
        `;
        document.getElementById("subtotal-keranjang").textContent = "Rp 0";
        return;
      }

      let subtotal = 0;
      wadah.innerHTML = keranjang.map((item, idx) => {
        const sub = item.hargaAngka * item.qty;
        subtotal += sub;
        const varian = item.warna ? `${item.warna}, Ukuran ${item.ukuran}` : `Ukuran ${item.ukuran || "M"}`;
        return `
          <div class="baris-item">
            <div style="display:flex; align-items:center; gap:12px;">
              <div class="thumb-item">FW</div>
              <div>
                <div style="font-size:14px; font-weight:bold;">${item.nama}</div>
                <div style="font-size:12px; color:#64748B;">${varian} &bull; ${formatRp(item.hargaAngka)}</div>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;">
              <div class="kontrol-qty">
                <button type="button" class="btn-qty" onclick="ubahQty(${idx}, -1)">&minus;</button>
                <span style="font-size:13px; font-weight:bold; min-width:18px; text-align:center;">${item.qty}</span>
                <button type="button" class="btn-qty" onclick="ubahQty(${idx}, 1)">+</button>
              </div>
              <strong style="font-size:13px; min-width:85px; text-align:right;">${formatRp(sub)}</strong>
              <button type="button" class="btn-hapus" onclick="hapusItem(${idx})">Hapus</button>
            </div>
          </div>
        `;
      }).join("");

      document.getElementById("subtotal-keranjang").textContent = formatRp(subtotal);
    }

    renderKeranjang();
  </script>
</body>
</html>
